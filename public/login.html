<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accedi — La Cassetta degli AI-trezzi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #3a3a3a;
      --surface: #2e2e2e;
      --surface2: #252525;
      --accent: #2bb5a3;
      --accent-hover: #1f9e8f;
      --border: #1f5c5c;
      --text: #e0e0e0;
      --muted: #aaa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-row img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
    }

    .logo-row .brand {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .logo-row .brand strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    input[type="email"] {
      background: var(--surface2);
      border: 1px solid #444;
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input[type="email"]:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.8rem 1.5rem;
      transition: background 0.15s;
      width: 100%;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      display: none;
      font-size: 0.88rem;
      padding: 0.75rem 1rem;
    }

    .error.visible { display: block; }

    .footer-note {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <img src="/logo.jpg" alt="Logo" />
      <div class="brand">
        <strong>La Cassetta degli AI-trezzi</strong>
        Strumenti per l'Officina
      </div>
    </div>

    <div>
      <h1>Accedi all'Officina</h1>
      <p class="subtitle" style="margin-top:0.5rem">
        Questo strumento è riservato agli iscritti paganti. Inserisci l'email con cui ti sei iscritto.
      </p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email di iscrizione</label>
        <input type="email" id="email" name="email" placeholder="tua@email.com" required autocomplete="email" />
      </div>
      <div class="error" id="errorMsg"></div>
      <button type="submit" id="submitBtn" style="margin-top:1rem">Accedi</button>
    </form>

    <p class="footer-note">
      Non sei ancora iscritto?<br />
      <a href="https://lacassettadegliaitrezzi.substack.com" target="_blank" rel="noopener">
        Scopri L'Officina su Substack →
      </a>
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    // Accetta solo path same-origin (deve iniziare con "/" ma non con "//" o "/\")
    // per prevenire open redirect via ?next=https://evil.com o ?next=//evil.com
    const rawNext = new URLSearchParams(location.search).get('next');
    const next = (rawNext && /^\/[^/\\]/.test(rawNext)) ? rawNext : '/app';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifico…';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim() }),
        });
        const data = await res.json();
        if (res.ok) {
          location.href = next;
        } else {
          errorMsg.textContent = data.error || 'Accesso negato.';
          errorMsg.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Accedi';
        }
      } catch {
        errorMsg.textContent = 'Errore di rete. Riprova.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Accedi';
      }
    });
  </script>
</body>
</html>
