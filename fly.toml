# Sostituisci 'html-to-pdf' con il nome app che hai creato su Fly.io
app = 'html-to-pdf'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1  # tieni sempre 1 macchina viva → niente cold start

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
